<!-- SCRIPT DE FIREBASE CON MODO DE DIAGNÓSTICO -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCVAT1MlG5Th9PCGhrvJOscSwheAU_NwSM",
          authDomain: "luciana-admin.firebaseapp.com",
          projectId: "luciana-admin",
          storageBucket: "luciana-admin.firebasestorage.app",
          messagingSenderId: "947292275956",
          appId: "1:947292275956:web:2b1d1ca9a755e7c2160aa1",
          measurementId: "G-1NGVNJPQ6L"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        window.loadCatalog = function(url, title) {
            document.getElementById('catalog-title').innerText = title;
            document.getElementById('catalog-frame').src = url;
            document.getElementById('colecciones').scrollIntoView({ behavior: 'smooth' });
        }

        var modal = document.getElementById("adminModal");
        window.openModal = function() { modal.style.display = "block"; }
        window.closeModal = function() { modal.style.display = "none"; }
        window.onclick = function(event) { if (event.target == modal) modal.style.display = "none"; }

        window.login = function() {
            var email = document.getElementById("email").value.trim(); // .trim() borra espacios accidentales
            var pass = document.getElementById("password").value;
            var msgBox = document.getElementById("login-msg");
            
            msgBox.style.display = "none";
            document.getElementById("loginBtn").innerText = "Conectando con Firebase...";

            signInWithEmailAndPassword(auth, email, pass)
                .then((userCredential) => {
                    document.getElementById('storefront').style.display = "none";
                    document.getElementById('main-header').style.display = "none";
                    window.closeModal();
                    document.getElementById('admin-panel').style.display = "block";
                    document.getElementById("email").value = "";
                    document.getElementById("password").value = "";
                    document.getElementById("loginBtn").innerText = "Ingresar";
                })
                .catch((error) => {
                    // AQUÍ ESTÁ EL CAMBIO: Ahora mostrará el error real técnico
                    msgBox.innerText = "Error técnico: " + error.code;
                    msgBox.style.display = "block";
                    document.getElementById("loginBtn").innerText = "Ingresar";
                });
        }

        window.logout = function() {
            signOut(auth).then(() => {
                document.getElementById('admin-panel').style.display = "none";
                document.getElementById('storefront').style.display = "block";
                document.getElementById('main-header').style.display = "flex";
                window.scrollTo(0, 0);
            });
        }

        window.procesarBabyology = function() {
            var fileInput = document.getElementById('babyology-file');
            if(fileInput.files.length > 0) { alert("Has subido el Excel: " + fileInput.files[0].name); } 
            else { alert("Por favor, selecciona un archivo Excel primero."); }
        }

        window.procesarRikury = function() {
            var fileInput = document.getElementById('rikury-file');
            if(fileInput.files.length > 0) { alert("Has subido la imagen: " + fileInput.files[0].name); } 
            else { alert("Por favor, selecciona una imagen primero."); }
        }

        window.procesarBoleta = function() {
            var texto = document.getElementById('boleta-text').value;
            if(texto.trim() !== "") { alert("Has ingresado texto."); } 
            else { alert("Por favor, ingresa algún texto en el recuadro primero."); }
        }
    </script>
</body>
</html>
